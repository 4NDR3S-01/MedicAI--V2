# Configuración de PostgreSQL optimizada para servidores con ~2 GB RAM,
# CPU de bajo rendimiento (Intel Celeron N2840) y almacenamiento eMMC.
#
# Uso:
#   sudo cp /etc/postgresql/18/main/postgresql.conf /etc/postgresql/18/main/postgresql.conf.bak
#   sudo cp postgresql-low-ram.conf /etc/postgresql/18/main/postgresql.conf
#   sudo systemctl restart postgresql
#
# Ajusta el número de versión (18) según tu instalación.

# -----------------------------------------------------------------------------
# Conexiones
# -----------------------------------------------------------------------------
# Una sola app con pool de 3 conexiones no necesita más de 20.
max_connections = 20

# -----------------------------------------------------------------------------
# Memoria
# -----------------------------------------------------------------------------
# shared_buffers: en servidores con <= 2 GB, 128 MB es el punto óptimo de
# retorno. Más no ayuda porque el kernel no puede cachear eficientemente.
shared_buffers = 128MB

# effective_cache_size: estimación de cuánta memoria puede usar el SO para
# cachear archivos. En 2 GB totales, dejar ~512 MB es razonable.
effective_cache_size = 512MB

# work_mem: memoria por operación de ordenamiento/hash. Bajo para evitar
# swapping. Si hay muchas conexiones concurrentes, bajar a 2MB.
work_mem = 4MB

# maintenance_work_mem: usado por VACUUM, CREATE INDEX, etc. No demasiado alto
# porque estas operaciones raramente corren simultáneamente.
maintenance_work_mem = 32MB
temp_buffers = 4MB

# -----------------------------------------------------------------------------
# WAL (Write-Ahead Log)
# -----------------------------------------------------------------------------
wal_buffers = 4MB
min_wal_size = 256MB
max_wal_size = 1GB
checkpoint_completion_target = 0.9
wal_compression = on

# -----------------------------------------------------------------------------
# Planificador de consultas
# -----------------------------------------------------------------------------
# eMMC es más rápida que disco mecánico pero no tan rápida como SSD.
random_page_cost = 1.1

# Con eMMC no se beneficia de I/O concurrente.
effective_io_concurrency = 1

# Estadísticas por defecto.
default_statistics_target = 100

# -----------------------------------------------------------------------------
# Autovacuum
# -----------------------------------------------------------------------------
# Mantenerlo activo pero con pocos recursos para evitar picos de I/O.
autovacuum = on
autovacuum_max_workers = 1
autovacuum_naptime = 1min
autovacuum_vacuum_threshold = 50
autovacuum_analyze_threshold = 50

# -----------------------------------------------------------------------------
# Logging
# -----------------------------------------------------------------------------
logging_collector = on
log_directory = '/var/log/postgresql'
log_min_messages = warning
log_min_error_statement = error
log_line_prefix = '%t [%p]: '
log_rotation_age = 1d
log_rotation_size = 10MB
log_truncate_on_rotation = on

# -----------------------------------------------------------------------------
# Rendimiento general
# -----------------------------------------------------------------------------
# fsync debe permanecer on en producción a menos que aceptes pérdida de datos.
fsync = on
synchronous_commit = on

# -----------------------------------------------------------------------------
# Localización
# -----------------------------------------------------------------------------
# Si todo corre en la misma máquina, escuchar solo en localhost evita tráfico
# de red innecesario y reduce exposición.
listen_addresses = '127.0.0.1'

# Conexión por socket Unix (más rápida y con menos overhead que TCP).
# Desde Prisma: postgresql://user:pass@/medicai?host=/var/run/postgresql
unix_socket_directories = '/var/run/postgresql'
